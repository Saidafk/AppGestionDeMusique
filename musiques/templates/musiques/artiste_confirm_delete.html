{% extends "musiques/base.html" %}
{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-header bg-danger text-white">
          <h4 class="mb-0">Supprimer l'artiste</h4>
        </div>
        <div class="card-body">
          <p>Êtes-vous sûr de vouloir supprimer l'artiste <strong>{{ object.nom }}</strong> ?</p>
          <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Confirmer la suppression</button>
            <a href="{% url 'musiques:artiste-detail' object.pk %}" class="btn btn-secondary ms-2">Annuler</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
