{% extends "musiques/base.html" %}
{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-lg border-0">
        <div class="card-header bg-primary text-white py-3">
          <h3 class="mb-0 d-flex align-items-center">
            <i class="bi bi-person-fill me-2"></i>
            {% if object %}Modifier{% else %}Ajouter{% endif %} un artiste
          </h3>
        </div>
        <div class="card-body bg-light">
          <form method="post" class="p-2">
            {% csrf_token %}
            <div class="mb-4">
              <label for="{{ form.nom.id_for_label }}" class="form-label fw-semibold">
                <i class="bi bi-person me-1"></i> Nom <span class="text-danger">*</span>
              </label>
              <input type="text"
                     name="{{ form.nom.name }}"
                     id="{{ form.nom.id_for_label }}"
                     class="form-control form-control-lg {% if form.nom.errors %}is-invalid{% endif %}"
                     placeholder="Nom de l'artiste"
                     value="{{ form.nom.value|default_if_none:'' }}"
                     required>
              {% if form.nom.errors %}
                <div class="invalid-feedback d-block">
                  {{ form.nom.errors }}
                </div>
              {% endif %}
            </div>

            <hr class="my-4">
            
            <div class="d-flex justify-content-between">
              <a class="btn btn-outline-secondary" href="{% url 'musiques:artiste-list' %}">
                <i class="bi bi-arrow-left-circle me-1"></i> Annuler
              </a>
              <button class="btn btn-success px-4" type="submit">
                <i class="bi bi-check-circle me-1"></i> Enregistrer
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
